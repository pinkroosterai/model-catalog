name: Release

# Tags publish the NuGet package only. The container image is built by CI on every push to
# main and tagged with the short sha plus `current`, because the estate pulls a moving tag and
# rolls back by sha — a tag-triggered image would leave `current` pointing at whatever was last
# released rather than what main says.
#
# The tag decides the published version: the pack step passes -p:Version derived from it, which
# overrides <Version> in ModelCatalog.Client.csproj. Bump the csproj with the tag anyway so the
# repository does not misstate its own version — but a mismatch publishes the tag's version, not
# the csproj's, and says nothing.
on:
  push:
    tags: ['v*.*.*']

jobs:
  nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          dotnet pack src/ModelCatalog.Client/ModelCatalog.Client.csproj \
            -c Release -o nupkg -p:Version="$VERSION"
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
